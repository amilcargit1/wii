<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Yesica 💛</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CONTRASEÑA -->
  <section id="password" class="screen no-tap">
    <div class="sky"></div>
    <div class="pass-content">
      <p class="pass-icon">🔒</p>
      <p class="pass-title">Esto es solo para ti...</p>
      <p class="pass-sub">Escribe la palabra clave</p>
      <input type="text" id="passInput" class="pass-input" autocomplete="off" spellcheck="false">
      <button id="passBtn" class="start-btn">✨ Entrar ✨</button>
      <p class="pass-error" id="passError">Esa no es... intenta de nuevo 💛</p>
    </div>
  </section>

  <!-- MODO REGALO -->
  <section id="gift" class="screen hidden">
    <div class="sky"></div>
    <div class="gift-content">
      <div class="envelope" id="envelope">
        <div class="envelope-glow"></div>
        <div class="envelope-body">
          <div class="envelope-flap"></div>
          <div class="envelope-seal">💛</div>
        </div>
      </div>
      <p class="gift-text">Tienes un regalo especial...</p>
      <p class="gift-sub">✨ Toca para abrir ✨</p>
    </div>
  </section>

  <!-- PANTALLA INICIAL -->
  <section id="intro" class="screen hidden">
    <div class="sky"></div>
    <div class="intro-content">
      <div class="bud">
        <div class="bud-glow"></div>
        <div class="bud-shape"></div>
      </div>
      <p class="pre-title">Para alguien muy especial... 💛</p>
      <h1 class="name-title" id="nameTitle"></h1>
      <button id="startBtn" class="start-btn">✨ Toca para comenzar ✨</button>
    </div>
  </section>

  <!-- ESCENA PRINCIPAL -->
  <section id="garden" class="screen hidden">
    <div class="sky" id="gardenSky"></div>
    <div class="moon"></div>
    <p class="galaxy-title">Feliz Día de las Flores Amarillas 🌻</p>
    <div class="halo"><div class="halo-core"></div></div>
    <div class="particle-flower show" id="particleFlower"></div>
    <div class="particle-heart" id="particleHeart"></div>
    <div class="ticker-wrap" id="tickerWrap"></div>
    <div class="word-cloud" id="wordCloud"></div>
    <div class="orbit-rings" id="orbitRings"></div>
    <div class="field" id="field"></div>
    <div class="bouquets" id="bouquets"></div>

    <div class="message-box" id="messageBox">
      <p class="msg line1"></p>
      <p class="msg line2"></p>
      <p class="msg line3"></p>
      <p class="msg line4"></p>
    </div>

    <div class="counter-box" id="counterBox">
      <p class="counter-label">Llevamos juntos</p>
      <p class="counter-value" id="counterValue">-</p>
    </div>

    <div class="popup" id="popup"></div>

    <button id="letterBtn" class="letter-btn" aria-label="Carta">💌</button>
    <button id="musicToggle" class="music-btn" aria-label="Música">🔇</button>
    <audio id="bgMusic" src="assets/music.mp3" loop></audio>
  </section>

  <!-- CARTA -->
  <div class="letter-overlay" id="letterOverlay">
    <div class="letter-card">
      <button class="letter-close" id="letterClose" aria-label="Cerrar">✕</button>
      <p class="letter-title">Para ti, Yesica 💛</p>
      <div class="letter-text" id="letterText"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
